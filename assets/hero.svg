<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="엑셀과 종이가 DB로 모여 업무 포털이 되는 모습">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1630"/><stop offset="1" stop-color="#0f4c8a"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/><stop offset="0.5" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <style>
    text{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif}
  </style>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect width="900" height="300" rx="18" fill="url(#dots)"/>

  <text x="48" y="126" font-size="58" font-weight="800" fill="#fff" letter-spacing="1">celldentity</text>
  <text x="50" y="172" font-size="22" fill="#cfe3ff">인사·총무 실무자.</text>
  <text x="50" y="204" font-size="22" fill="#cfe3ff">반복되는 업무를 직접 만들어 없앱니다.</text>

  <!-- 라벨 -->
  <g font-size="13" font-weight="700" fill="#8bbcff" text-anchor="middle">
    <text x="545" y="48">엑셀 · 종이</text>
    <text x="690" y="48">DB</text>
    <text x="815" y="48">업무 포털</text>
  </g>

  <!-- 왼쪽: 흩어진 파일 (고정, 흐릿) -->
  <g opacity="0.35" fill="#34d399">
    <rect x="532" y="82" width="26" height="20" rx="3"/>
    <rect x="532" y="122" width="26" height="20" rx="3" fill="#fff"/>
    <rect x="532" y="162" width="26" height="20" rx="3"/>
    <rect x="532" y="202" width="26" height="20" rx="3" fill="#fff"/>
  </g>

  <!-- 파일이 DB로 모이는 움직임 -->
  <g>
    <g>
      <rect x="-13" y="-10" width="26" height="20" rx="3" fill="#34d399"/>
      <animateMotion dur="3.2s" begin="0s" repeatCount="indefinite" path="M545,92 C600,92 640,140 690,150"/>
      <animate attributeName="opacity" dur="3.2s" begin="0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.8;1"/>
    </g>
    <g>
      <rect x="-13" y="-10" width="26" height="20" rx="3" fill="#fff"/>
      <animateMotion dur="3.2s" begin="0.8s" repeatCount="indefinite" path="M545,132 C600,132 640,148 690,150"/>
      <animate attributeName="opacity" dur="3.2s" begin="0.8s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.8;1"/>
    </g>
    <g>
      <rect x="-13" y="-10" width="26" height="20" rx="3" fill="#34d399"/>
      <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M545,172 C600,172 640,152 690,150"/>
      <animate attributeName="opacity" dur="3.2s" begin="1.6s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.8;1"/>
    </g>
    <g>
      <rect x="-13" y="-10" width="26" height="20" rx="3" fill="#fff"/>
      <animateMotion dur="3.2s" begin="2.4s" repeatCount="indefinite" path="M545,212 C600,212 640,160 690,150"/>
      <animate attributeName="opacity" dur="3.2s" begin="2.4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.8;1"/>
    </g>
  </g>

  <!-- DB -->
  <g>
    <circle cx="690" cy="150" r="46" fill="#60a5fa" opacity="0.35" filter="url(#glow)">
      <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="0.2;0.55;0.2"/>
    </circle>
    <path d="M656,128 v44 a34,11 0 0 0 68,0 v-44 z" fill="url(#db)"/>
    <ellipse cx="690" cy="128" rx="34" ry="11" fill="#93c5fd"/>
    <path d="M656,150 a34,11 0 0 0 68,0" fill="none" stroke="#1e3a8a" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <!-- 업무 포털 화면 3개 -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <g>
      <rect x="772" y="84" width="86" height="34" rx="8" fill="#fff"/>
      <text x="815" y="106" fill="#0f2a5c">근태·연차</text>
      <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="0.3;1;0.3;0.3" keyTimes="0;0.35;0.7;1"/>
    </g>
    <g>
      <rect x="772" y="133" width="86" height="34" rx="8" fill="#fff"/>
      <text x="815" y="155" fill="#0f2a5c">급여명세서</text>
      <animate attributeName="opacity" dur="3.2s" begin="1.07s" repeatCount="indefinite" values="0.3;1;0.3;0.3" keyTimes="0;0.35;0.7;1"/>
    </g>
    <g>
      <rect x="772" y="182" width="86" height="34" rx="8" fill="#fff"/>
      <text x="815" y="204" fill="#0f2a5c">채용·입퇴사</text>
      <animate attributeName="opacity" dur="3.2s" begin="2.13s" repeatCount="indefinite" values="0.3;1;0.3;0.3" keyTimes="0;0.35;0.7;1"/>
    </g>
  </g>

  <!-- DB에서 포털로 나가는 점 -->
  <g fill="#fde68a">
    <circle r="4"><animateMotion dur="3.2s" begin="0.4s" repeatCount="indefinite" path="M724,146 C745,140 755,101 772,101"/><animate attributeName="opacity" dur="3.2s" begin="0.4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/></circle>
    <circle r="4"><animateMotion dur="3.2s" begin="1.47s" repeatCount="indefinite" path="M724,150 L772,150"/><animate attributeName="opacity" dur="3.2s" begin="1.47s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/></circle>
    <circle r="4"><animateMotion dur="3.2s" begin="2.53s" repeatCount="indefinite" path="M724,154 C745,160 755,199 772,199"/><animate attributeName="opacity" dur="3.2s" begin="2.53s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/></circle>
  </g>
</svg>
