<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 108" width="904" height="108" role="img" aria-label="HSMnT 규모: 기능 모듈 70개 이상, 코드 20만 줄 이상, 자동 점검 테스트 120개 이상, 1인 설계·개발·운영">
