    <text x="104" y="60" text-anchor="middle" font-size="38" font-weight="800" fill="#fff">20만 줄+</text>
    <text x="104" y="87" text-anchor="middle" font-size="14" fill="#8bbcff">Python · TypeScript</text>
    <animate attributeName="opacity" dur="0.6s" begin="0.15s" values="0;1" fill="freeze"/>
  </g>
  <g transform="translate(452,0)">
    <rect x="0" y="0" width="208" height="108" rx="14" fill="#0b1630" stroke="#1d4ed8" stroke-opacity="0.55"/>
    <rect x="0" y="0" width="208" height="4" rx="2" fill="url(#bar)"/>
    <text x="104" y="60" text-anchor="middle" font-size="38" font-weight="800" fill="#fff">120+</text>
    <text x="104" y="87" text-anchor="middle" font-size="14" fill="#8bbcff">자동 점검 테스트</text>
    <animate attributeName="opacity" dur="0.6s" begin="0.3s" values="0;1" fill="freeze"/>
