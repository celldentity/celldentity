  <style>text{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif}</style>
  <g transform="translate(0,0)">
    <rect x="0" y="0" width="208" height="108" rx="14" fill="#0b1630" stroke="#1d4ed8" stroke-opacity="0.55"/>
    <rect x="0" y="0" width="208" height="4" rx="2" fill="url(#bar)"/>
    <text x="104" y="60" text-anchor="middle" font-size="38" font-weight="800" fill="#fff">70+</text>
    <text x="104" y="87" text-anchor="middle" font-size="14" fill="#8bbcff">기능 모듈</text>
    <animate attributeName="opacity" dur="0.6s" begin="0.0s" values="0;1" fill="freeze"/>
  </g>
  <g transform="translate(226,0)">
    <rect x="0" y="0" width="208" height="108" rx="14" fill="#0b1630" stroke="#1d4ed8" stroke-opacity="0.55"/>
