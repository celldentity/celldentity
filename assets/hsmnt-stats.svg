    <text x="104" y="60" text-anchor="middle" font-size="38" font-weight="800" fill="#fff">1인</text>
    <text x="104" y="87" text-anchor="middle" font-size="14" fill="#8bbcff">설계 · 개발 · 운영</text>
    <animate attributeName="opacity" dur="0.6s" begin="0.44999999999999996s" values="0;1" fill="freeze"/>
